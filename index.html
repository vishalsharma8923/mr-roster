    --bg: #0E141A; --surface: #161F28; --surface2: #1B2631; --ink: #E7EDF3; --muted: #94A3B3; --line: #2B3948; --line2: #223040;
    --btn: #DDE7F2; --btnText: #0E141A; --focus: #7FA6FF; --ok: #6FD3A0; --okBg: #16352A; --warn: #F0BE6B; --warnBg: #3A2E14; --bad: #FF8F86; --badBg: #3E1D1B;
    --userBubble: #2A3C52; --userText: #F2F6FA;
    --c-M: #D9A23A; --t-M: #1C1300; --c-E: #D9714A; --t-E: #1F0A02; --c-N: #6F79E8; --t-N: #0B0F33; --c-NB: #B27ADB; --t-NB: #1B0A29; --c-EW: #CF6F8D; --t-EW: #1F0310;
    --c-G: #46A584; --t-G: #04170F; --c-OFF: #1F2A36; --t-OFF: #6E7C8C; --c-CL: #19222C; --weekend: #1A2430; --hol: #FF8F86; --c-LV1: #24486B; --c-LV2: #1C3652; --t-LV: #BBD8F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #161F28; --surface2: #1B2631; --ink: #E7EDF3; --muted: #94A3B3; --line: #2B3948; --line2: #223040;
  --btn: #DDE7F2; --btnText: #0E141A; --focus: #7FA6FF; --ok: #6FD3A0; --okBg: #16352A; --warn: #F0BE6B; --warnBg: #3A2E14; --bad: #FF8F86; --badBg: #3E1D1B;
  --userBubble: #2A3C52; --userText: #F2F6FA;
  --c-M: #D9A23A; --t-M: #1C1300; --c-E: #D9714A; --t-E: #1F0A02; --c-N: #6F79E8; --t-N: #0B0F33; --c-NB: #B27ADB; --t-NB: #1B0A29; --c-EW: #CF6F8D; --t-EW: #1F0310;
  --c-G: #46A584; --t-G: #04170F; --c-OFF: #1F2A36; --t-OFF: #6E7C8C; --c-CL: #19222C; --weekend: #1A2430; --hol: #FF8F86; --c-LV1: #24486B; --c-LV2: #1C3652; --t-LV: #BBD8F5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 2200px; margin: 0 auto; padding-block: 18px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 38px; height: 38px; border-radius: 9px; background: var(--btn); color: var(--btnText); display: grid; place-items: center; font-family: var(--mono); font-weight: 500; font-size: 14px; letter-spacing: .02em; flex: none; }
.brand h1 { margin: 0; font-size: 19px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.prog { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.prog .bar { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--btn); width: 0; transition: width .3s; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 24vw, 440px); gap: 24px; align-items: start; }
.chat { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.panel { position: sticky; top: calc(14px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 28px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.panel summary { list-style: none; padding: 14px 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line2); cursor: default; }
.panel summary::-webkit-details-marker { display: none; }
.panel summary small { font-family: var(--mono); font-weight: 400; color: var(--muted); font-size: 12px; }
.item { padding: 12px 16px; border-bottom: 1px solid var(--line2); display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; }
.item:last-child { border-bottom: 0; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; }
.item.done .dot { background: var(--ok); border-color: var(--ok); position: relative; }
.item.done .dot::after { content: ""; position: absolute; left: 3px; top: 0px; width: 4px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.item.active .dot, .item.now .dot { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.item.now .lab { color: var(--ink); }
.item.locked { opacity: .5; }
.item .lab { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.item .v { font-weight: 600; margin-top: 1px; overflow-wrap: anywhere; }
.item .s { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.item .s.mono { font-family: var(--mono); font-size: 12px; }
.item.pending .v { color: var(--muted); font-weight: 400; }
.link { background: none; border: 0; padding: 2px 6px; border-radius: 6px; color: var(--focus); font-size: 13px; font-weight: 600; }
.link:hover { background: var(--surface2); }
.row { display: flex; gap: 10px; align-items: flex-end; max-width: 100%; }
.msg { display: flex; gap: 10px; max-width: 100%; }
.msg:not(.user) .bub { flex: 1 1 auto; }
.msg .bub { font-size: clamp(15px, 0.9vw + 6px, 18px); line-height: 1.55; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.av { width: 28px; height: 28px; border-radius: 8px; background: var(--btn); color: var(--btnText); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; flex: none; margin-top: 2px; }
.bub { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 10px 14px; min-width: 0; overflow-wrap: anywhere; }
.msg.user .bub { background: var(--userBubble); color: var(--userText); border-color: transparent; border-radius: 14px 4px 14px 14px; }
.bub p { margin: 0; } .bub p + p { margin-top: 6px; }
.bub .mono { font-family: var(--mono); font-size: 12.5px; }
.typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-left: 38px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h3 { margin: 0; font-size: 15px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
input[type=text], input[type=date], input[type=time], input[type=number], select, textarea { background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-width: 0; width: 100%; }
textarea { min-height: 84px; font-family: var(--mono); font-size: 12.5px; resize: vertical; }
input[type=number] { font-family: var(--mono); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 6px 13px; font-weight: 500; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed=true] { background: var(--btn); color: var(--btnText); border-color: var(--btn); }
.chip.mono { font-family: var(--mono); font-size: 13px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface2); align-self: flex-start; }
.stepper button { width: 38px; height: 38px; border: 0; background: transparent; font-size: 20px; line-height: 1; }
.stepper button:hover { background: var(--line2); }
.stepper input { width: 56px; text-align: center; border: 0; border-inline: 1px solid var(--line); border-radius: 0; background: var(--surface); height: 38px; font-weight: 600; padding: 0; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { background: var(--btn); color: var(--btnText); border: 1px solid var(--btn); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn:hover { filter: brightness(1.12); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface2); filter: none; }
.btn.small { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.est { background: var(--surface2); border: 1px solid var(--line2); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.estrow { display: flex; align-items: center; gap: 14px; }
.estnum { font-size: 34px; font-weight: 700; line-height: 1; min-width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; background: var(--btn); color: var(--btnText); }
.est .sub { color: var(--muted); font-size: 13.5px; }
.how { margin-top: 8px; font-size: 13.5px; }
.how summary { cursor: pointer; color: var(--focus); font-weight: 600; }
.how ol { margin: 8px 0 0; padding-left: 20px; line-height: 1.6; color: var(--muted); }
.est .big { font-size: 15px; font-weight: 600; }
.est .mono { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.note { border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }
.note.ok { background: var(--okBg); color: var(--ok); } .note.warn { background: var(--warnBg); color: var(--warn); } .note.bad { background: var(--badBg); color: var(--bad); }
.errs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.errs li { background: var(--badBg); color: var(--bad); border-radius: 9px; padding: 8px 12px; font-size: 13.5px; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.errs li b { font-weight: 600; }
.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; background: var(--surface2); color: var(--muted); }
.drop.over { border-color: var(--focus); background: var(--surface); }
.drop b { color: var(--ink); }
.files { display: flex; flex-direction: column; gap: 8px; }
.file { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.file .hd { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.file .nm { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--okBg); color: var(--ok); } .pill.warn { background: var(--warnBg); color: var(--warn); } .pill.bad { background: var(--badBg); color: var(--bad); } .pill.n { background: var(--surface2); color: var(--muted); border: 1px solid var(--line2); }
.hl { display: flex; flex-wrap: wrap; gap: 6px; max-height: 120px; overflow: auto; }
.hl span { background: var(--surface2); border: 1px solid var(--line2); border-radius: 8px; padding: 2px 9px; font-size: 12.5px; }
.hl span em { font-style: normal; font-family: var(--mono); color: var(--muted); margin-right: 6px; }
.hl span.out { opacity: .55; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; align-self: flex-start; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface2); padding: 8px 14px; font-weight: 500; }
.seg button[aria-pressed=true] { background: var(--btn); color: var(--btnText); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 6px 10px; border-bottom: 1px solid var(--line2); vertical-align: top; }
.tbl td.num, .tbl th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; max-width: 100%; }
.shiftgrid { display: grid; grid-template-columns: 60px repeat(2, minmax(90px, 1fr)); gap: 8px 10px; align-items: center; }
.shiftgrid .code { font-family: var(--mono); font-weight: 500; }
details.more > summary { cursor: pointer; font-weight: 600; color: var(--focus); }

/* Results */
.results { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rhead { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.rhead h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.01em; }
.rhead p { margin: 0; color: var(--muted); font-size: 13.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 16px; height: 16px; border-radius: 4px; display: inline-grid; place-items: center; font-family: var(--mono); font-size: 10px; font-weight: 500; }
.res { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.res.first { border-color: var(--btn); box-shadow: 0 0 0 1px var(--btn); }
.res .body { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 14px; padding: 16px 18px; }
.rank { font-family: var(--mono); font-size: 26px; font-weight: 500; line-height: 1; padding-top: 3px; color: var(--muted); }
.res.first .rank { color: var(--ink); }
.res h3 { margin: 0; font-size: 16.5px; letter-spacing: -.005em; }
.res .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.score { font-family: var(--mono); font-weight: 500; font-size: 13px; background: var(--btn); color: var(--btnText); padding: 2px 9px; border-radius: 999px; }
.why { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.why li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; }
.why li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--ok); }
.why li.warn::before { background: #E1A12A; }
.vs { margin-top: 10px; font-size: 13.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.mini { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; max-width: 100%; overflow: hidden; }
.mini div { display: flex; gap: 1px; }
.mini i { flex: 1 1 0; min-width: 2px; height: 7px; border-radius: 1px; }
.bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 14px; margin-top: 12px; }
.bars div { font-size: 12px; color: var(--muted); }
.bars div b { display: block; height: 5px; border-radius: 3px; background: var(--line); margin-top: 3px; overflow: hidden; }
.bars div b i { display: block; height: 100%; background: var(--btn); }
.bars div span { font-family: var(--mono); color: var(--ink); float: right; }
.rfoot { border-top: 1px solid var(--line2); padding: 10px 18px; display: flex; gap: 10px; flex-wrap: wrap; background: var(--surface2); }
.detail { border-top: 1px solid var(--line2); padding: 16px 18px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.detail h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.ros { --cell: 40px; border-collapse: separate; border-spacing: 3px; font-size: 13px; }
table.ros th { font-weight: 500; color: var(--muted); font-family: var(--mono); font-size: max(11px, calc(var(--cell) * .3)); text-align: center; padding: 0 0 3px; min-width: var(--cell); }
table.ros th.wk { color: var(--ink); }
table.ros th.hol { color: var(--hol); }
table.ros th small { display: block; font-size: max(10px, calc(var(--cell) * .26)); opacity: .85; }
table.ros td.nm { position: sticky; left: 0; background: var(--surface); z-index: 1; padding-right: 12px; white-space: nowrap; font-weight: 600; font-size: 15px; }
table.ros td.st { font-family: var(--mono); font-size: 13px; padding-left: 10px; text-align: right; white-space: nowrap; color: var(--muted); }
table.ros td.c { width: var(--cell); height: calc(var(--cell) * .9); min-width: var(--cell); text-align: center; font-family: var(--mono); font-size: calc(var(--cell) * .38); font-weight: 500; border-radius: 6px; cursor: pointer; position: relative; }
table.ros td.c.sel { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 2; }
table.ros td.c.home::after { content: "h"; position: absolute; right: 3px; bottom: 0; font-size: calc(var(--cell) * .24); opacity: .85; }
.final { border-color: var(--btn); box-shadow: 0 0 0 1px var(--btn); }
.final h2 { margin: 0 0 4px; font-size: 17px; }
.sumtbl td, .sumtbl th { white-space: nowrap; }
.sumtbl th { white-space: normal; min-width: 70px; vertical-align: bottom; }
.sumtbl tr.tot td { font-weight: 700; border-top: 2px solid var(--line); }
.ov { position: fixed; inset: 0; z-index: 100; background: var(--bg); overflow-y: auto; }
.ovbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px max(16px, 2vw); background: var(--surface); border-bottom: 1px solid var(--line); }
.ovt { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ovt b { font-size: 17px; }
.ovbody { max-width: 2000px; margin: 0 auto; padding: 16px max(16px, 2vw) 80px; }
.ovbody .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; border-top: 1px solid var(--line); }
.dly td, .dly th { vertical-align: top; }
.dly tr.wkd td { background: var(--weekend); }
.dly tr.hol td { color: var(--hol); font-weight: 600; }
.csum .sumtbl th, .csum .sumtbl td { padding: 6px 6px; font-size: 12px; }
.csum .sumtbl th { min-width: 0; letter-spacing: 0; }
@media print { body > :not(#rosterOverlay):not(script):not(style) { display: none !important; } .ov { position: static !important; overflow: visible !important; } .ovbar .row, .ovbar button, .actions, .zoom, .hint + .actions { display: none !important; } .ovbody { max-width: none; padding: 0; } body { background: #fff; } }
.sumhead { display: grid; gap: 4px; margin: 0 0 10px; font-size: 14px; }
.sumhead div { display: flex; justify-content: space-between; gap: 12px; max-width: 520px; }
.howto { margin-top: 10px; font-size: 13.5px; }
.howto summary { cursor: pointer; font-weight: 600; }
.howto ul { margin: 8px 0 0; padding-left: 18px; line-height: 1.5; }
.csum { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.csum > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.csum h4 { margin: 12px 0 6px; }
.zoom { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.tag { display: inline-block; font-family: var(--mono); font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 5px; color: var(--muted); font-weight: 500; vertical-align: 1px; }
.tl { background: var(--btn); color: var(--btnText); border-color: var(--btn); }
.c-M { background: var(--c-M); color: var(--t-M); } .c-E { background: var(--c-E); color: var(--t-E); } .c-N { background: var(--c-N); color: var(--t-N); }
.c-NB { background: var(--c-NB); color: var(--t-NB); } .c-EW { background: var(--c-EW); color: var(--t-EW); } .c-NBW { background: var(--c-NB); color: var(--t-NB); box-shadow: inset 0 -3px 0 var(--c-EW); } .c-G { background: var(--c-G); color: var(--t-G); }
.c-OFF { background: var(--c-OFF); color: var(--t-OFF); } .c-CL { background: var(--c-CL); color: var(--t-OFF); }
.c-LV { background: repeating-linear-gradient(135deg, var(--c-LV1) 0 5px, var(--c-LV2) 5px 10px); color: var(--t-LV); font-weight: 600; }
.ros td.c.cov { box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #0B7A55; }
.sw.cov { box-shadow: inset 0 0 0 1px #fff, inset 0 0 0 2px #0B7A55; background: var(--c-OFF); }
.lvlist { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.lvlist .lv { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; }
.lvlist .lv b { font-weight: 600; }

    <h1>Mr.<br>Roster</h1>

      <button class="wgo" id="letsStart" type="button">Let's Start</button>

  <header class="top">

</div>

      if (S.running) return;
      S.inp.service.svc = q.svc; S.inp.service.n = q.n; S.inp.period.start = q.range[0]; S.inp.period.end = q.range[1];
      S.inp.team.men = q.men; S.inp.team.women = q.women; S.inp.team.menNames = []; S.inp.team.womenNames = []; S.inp.team.touched = true;
      S.inp.weekoffs.perPerson = defaultWeekoffs();
      if (q.women > 0) { S.inp.women.start = '07:00'; S.inp.women.end = '21:00'; }
      STEPS.forEach(function (s) { S.done[s.id] = true; });
      var txt = q.svc + ' · ' + months.filter(function (m) { return m.value === cur; })[0].label + ' · ' + q.men + ' male + ' + q.women + ' female';
      clearWidget(); userSays(txt); renderPanel();
      S.seedOffset = 0; S.quick = true; generate(true);
    });
    var step = h('button', { class: 'link', type: 'button' }, 'I want to set holidays, leave and rules first');
    step.addEventListener('click', function () { clearWidget(); userSays('Set it up step by step'); ask('service'); });
    paint();
    return h('section', { class: 'card qs', 'aria-label': 'Quick start' },
      h('div', { class: 'qh' }, h('b', null, 'Quick start'), h('span', null, 'Four answers, then your roster. Everything else uses the standard rules.')),
      h('div', { class: 'qgrid' },
        field('1. Service hours', svcChips.el),
        field('2. Month', mChips.el),
        field('3. Male in the team', men.el), field('4. Female in the team', women.el)),
      info,
      h('div', { class: 'actions' }, go, step));
  }

  /* ---------- start ---------- */
  renderPanel();
  S.lead = 'Pick the service hours and how many people are needed on the Morning, Evening and Night shifts. It takes about two minutes, and you can go Back or Edit any answer later.';
  ask('service');
  window.__RM_STATE = S;
  (function () {
    var wrap = document.getElementById('wrap'), b = document.getElementById('letsStart');
    function go() { wrap.classList.remove('landing'); try { window.scrollTo(0, 0); } catch (e) {} var c = document.getElementById('chat'); if (c) { var f = c.querySelector('input,button'); if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} } } }
    if (b) b.addEventListener('click', go);
  })();
})();

</script>
</body></html>
